services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /app/secrets/firebase-adminsdk.json
    volumes:
      - ./secrets:/app/secrets:ro
      - ./seed:/app/seed:ro
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
