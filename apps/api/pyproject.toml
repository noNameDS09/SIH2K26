[project]
name = "kalasetu-api"
version = "0.1.0"
description = "KalaSetu FastAPI backbone"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.0.1",
  "httpx>=0.27.0",
  "google-genai>=1.0.0",
  "pillow>=10.4.0",
  "numpy>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
voice = ["streamlit>=1.40.0"]
studio = ["rembg>=2.0.65", "onnxruntime>=1.19.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalasetu_api"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
